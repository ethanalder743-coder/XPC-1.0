<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>XPC League</title><style>
:root{--bg:#070a10;--card:#111722;--line:#273044;--muted:#96a1b6;--accent:#6f7cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#1c2650 0,transparent 32%),var(--bg);color:#f5f7ff;font:15px Inter,system-ui,sans-serif;min-height:100vh}header{padding:58px max(5vw,20px) 30px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:18px}.brand img{width:70px;height:70px;border-radius:20px;object-fit:cover}.eyebrow{letter-spacing:.22em;text-transform:uppercase;color:#98a4ff;font-size:12px;font-weight:800}h1{font-size:clamp(34px,6vw,68px);margin:3px 0;letter-spacing:-.04em}.sub{color:var(--muted);font-size:17px}nav{display:flex;gap:8px;overflow:auto;padding:18px max(5vw,20px);position:sticky;top:0;background:#080c14ed;backdrop-filter:blur(15px);z-index:5;border-bottom:1px solid var(--line)}nav button{border:0;background:transparent;color:#aeb7ca;padding:10px 15px;border-radius:9px;font-weight:700;white-space:nowrap;cursor:pointer}nav button.active{background:var(--accent);color:white}main{width:min(1200px,90vw);margin:28px auto 70px}.page{display:none}.page.active{display:block}.hero-grid,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.metric,.card,.table-wrap{background:linear-gradient(145deg,#141b29,#0e131d);border:1px solid var(--line);border-radius:18px;padding:20px}.metric strong{display:block;font-size:34px;color:#a3adff;margin-top:4px}.card{position:relative;overflow:hidden}.team-head{display:flex;gap:13px;align-items:center}.logo{width:58px;height:58px;border-radius:15px;object-fit:contain;background:#090d16;padding:5px}.placeholder{display:grid;place-items:center;font-size:20px;font-weight:900}.budget{font-size:26px;font-weight:850;margin:20px 0 2px}.muted{color:var(--muted)}h2{font-size:28px;margin:0 0 18px}.table-wrap{overflow:auto;padding:0}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:15px;border-bottom:1px solid #242c3e}th{color:#8f9ab0;font-size:12px;text-transform:uppercase}.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:15px}.fixture .home{text-align:right}.versus{background:#252f46;border-radius:9px;padding:7px 10px}.winner{border-left:3px solid #d7b85b}.pos{color:#9ca8ff;font-size:12px;font-weight:900;letter-spacing:.12em}.empty{color:var(--muted);padding:30px;text-align:center}.error{background:#361923;border:1px solid #713043;color:#ff9fb0;padding:15px;border-radius:12px}@media(max-width:600px){header{padding-top:35px}.fixture{grid-template-columns:1fr}.fixture .home{text-align:center}}
</style></head><body><header><div class="brand"><img id="leagueIcon" hidden><div><div class="eyebrow">Official competition centre</div><h1 id="leagueName">XPC League</h1><div class="sub">Fixtures, standings, club finances, Team of the Week and honours.</div></div></div></header><nav id="nav"></nav><main id="content"><div class="empty">Loading live league data…</div></main><script>
const pages=['Overview','Teams','Fixtures','Standings','TOTW','Trophies'];let data;const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const img=(url,name)=>url?`<img class="logo" src="${e(url)}" alt="${e(name)} logo">`:`<div class="logo placeholder">${e(name.slice(0,2).toUpperCase())}</div>`;
function select(name){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.dataset.page===name));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.textContent===name))}
function render(){leagueName.textContent=data.league.name;if(data.league.icon_url){leagueIcon.src=data.league.icon_url;leagueIcon.hidden=false}nav.innerHTML=pages.map((p,i)=>`<button class="${i?'':'active'}" onclick="select('${p}')">${p}</button>`).join('');const next=data.fixtures[0];content.innerHTML=`
<section class="page active" data-page="Overview"><h2>League overview</h2><div class="hero-grid"><div class="metric">Clubs<strong>${data.teams.length}</strong></div><div class="metric">Matches played<strong>${data.results.length}</strong></div><div class="metric">Scheduled fixtures<strong>${data.fixtures.length}</strong></div><div class="metric">TOTW week<strong>${data.totw.week}</strong></div></div>${next?`<h2 style="margin-top:35px">Next fixture</h2><div class="card fixture"><b class="home">${e(next.home_team)}</b><span class="versus">VS</span><b>${e(next.away_team)}</b><span></span><small class="muted">${e(next.competition)}</small><small class="muted">${e(next.kickoff.replace('T',' '))}</small></div>`:''}</section>
<section class="page" data-page="Teams"><h2>Clubs and budgets</h2><div class="cards">${data.teams.map(t=>`<article class="card" style="border-top:3px solid ${e(t.colour)}"><div class="team-head">${img(t.logo_url,t.name)}<div><b>${e(t.name)}</b><div class="muted">Owner: ${e(t.owner||'Not appointed')}</div></div></div><div class="budget">£${t.budget}M</div><div class="muted">Roster ${t.roster_size} / ${t.roster_cap}</div></article>`).join('')||'<div class="empty">No clubs configured.</div>'}</div></section>
<section class="page" data-page="Fixtures"><h2>Fixture list</h2><div class="cards">${data.fixtures.map(f=>`<article class="card fixture"><b class="home">${e(f.home_team)}</b><span class="versus">VS</span><b>${e(f.away_team)}</b><span></span><small class="muted">${e(f.competition)}</small><small class="muted">${e(f.kickoff.replace('T',' '))}</small></article>`).join('')||'<div class="empty">No fixtures have been published.</div>'}</div></section>
<section class="page" data-page="Standings"><h2>League standings</h2><div class="table-wrap"><table><thead><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead><tbody>${data.standings.map((r,i)=>`<tr><td>${i+1}</td><td><b>${e(r.team)}</b></td><td>${r.played}</td><td>${r.won}</td><td>${r.drawn}</td><td>${r.lost}</td><td>${r.gd}</td><td><b>${r.points}</b></td></tr>`).join('')}</tbody></table></div></section>
<section class="page" data-page="TOTW"><h2>Team of the Week · Week ${data.totw.week}</h2><div class="cards">${data.totw.players.map(p=>`<article class="card"><div class="pos">${e(p.position)}</div><h3>${e(p.username)}</h3><div class="muted">${e(p.team)}</div><div class="budget">${Number(p.score).toFixed(2)}</div></article>`).join('')||'<div class="empty">No qualifying stats submitted this week.</div>'}</div></section>
<section class="page" data-page="Trophies"><h2>Trophy cabinet</h2><div class="cards">${data.trophy_winners.map(w=>`<article class="card winner"><div class="team-head">${img(w.trophy_logo,w.trophy_name)}<div><div class="pos">${e(w.season)}</div><h3>${e(w.trophy_name)}</h3></div></div><p><b>${e(w.team_name)}</b></p></article>`).join('')||data.trophies.map(t=>`<article class="card"><div class="team-head">${img(t.logo_url,t.name)}<h3>${e(t.name)}</h3></div><p class="muted">Awaiting its next winner.</p></article>`).join('')||'<div class="empty">No trophies configured.</div>'}</div></section>`}
fetch('/api/league').then(r=>{if(!r.ok)throw Error('Live data unavailable');return r.json()}).then(x=>{data=x;render()}).catch(err=>content.innerHTML=`<div class="error">${e(err.message)}. Check that the bot is online and the website variables are correct.</div>`);
</script></body></html>
